name: Build MapleStore IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Select latest stable Xcode available on the runner
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable
      - name: Install build log formatter
        run: command -v xcbeautify >/dev/null || brew install xcbeautify
      - name: Validate packaging checks
        run: python3 -m unittest discover -s Tests -v
      - name: Run upstream download protocol checks
        run: bash Resources/Scripts/check.downloads.sh
      - name: Build and validate unsigned IPA
        run: bash Resources/Scripts/build.maplestore.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: MapleStore-unsigned-${{ github.sha }}
          path: |
            build/MapleStore-unsigned.ipa
            build/MapleStore-unsigned.ipa.sha256
            build/build-info.txt
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MapleStore-build-log-${{ github.sha }}
          path: build/xcodebuild.log
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: MapleStore-unsigned-${{ github.sha }}
          path: package
      - name: Publish tagged build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            package/MapleStore-unsigned.ipa \
            package/MapleStore-unsigned.ipa.sha256 \
            package/build-info.txt \
            --title "MapleStore $GITHUB_REF_NAME" \
            --notes "Unsigned iOS app. Sign with your preferred sideloading tool before installing. App Store downloads require an eligible Apple Account; version availability is controlled by Apple."
